<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloads - XerahS</title>
    <meta name="description" content="Download XerahS releases for Windows, macOS, and Linux.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="{{ site.baseurl }}/css/tokens.css">
    <link rel="stylesheet" href="{{ site.baseurl }}/css/animations.css">
    <link rel="stylesheet" href="{{ site.baseurl }}/css/components.css">
    <link rel="stylesheet" href="{{ site.baseurl }}/css/layout.css">

    <style>
        .error-banner {
            position: sticky;
            top: 0;
            z-index: 2000;
            margin: 0;
            padding: 0.75rem 1rem;
            background: #fff3b0;
            color: #6d1f1f;
            border-bottom: 1px solid #b45309;
            font-size: 0.925rem;
            line-height: 1.4;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }

        .error-banner strong {
            color: #5f1616;
        }

        .error-banner-details {
            margin-top: 0.35rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.82rem;
            opacity: 0.9;
        }
    </style>

    <link rel="icon" href="{{ site.baseurl }}/favicon.ico">
</head>

<body>
    <div id="diagnostic-banner" class="error-banner" role="alert" aria-live="assertive" hidden></div>
    <!-- ═══════════════════════════════════════
         BACKGROUND SYSTEM
         ═══════════════════════════════════════ -->
    <div class="background-system">
        <div class="gradient-base"></div>
        <div class="noise-overlay"></div>
        <div class="blob blob-primary"></div>
        <div class="blob blob-secondary"></div>
        <div class="blob blob-tertiary"></div>
        <div class="blob blob-bottom"></div>
        <div class="grid-overlay"></div>
    </div>

    <!-- ═══════════════════════════════════════
         NAVIGATION
         ═══════════════════════════════════════ -->
    {% include navbar.html %}

    <main>
        <!-- ═══════════════════════════════════════
             DOWNLOADS HEADER
             ═══════════════════════════════════════ -->
        <section class="page-header">
            <div class="container">
                <div class="page-header-content animate-on-scroll">
                    <h1 class="page-title gradient-text">Downloads</h1>
                    <p class="page-subtitle">Get the latest XerahS releases for your platform</p>
                </div>
            </div>
        </section>

        <!-- ═══════════════════════════════════════
             macOS TROUBLESHOOTING
             ═══════════════════════════════════════ -->
        <section class="macos-troubleshooting-section">
            <div class="container">
                {% include macos-troubleshooting.html expanded=true %}
            </div>
        </section>

        <!-- ═══════════════════════════════════════
             TOTAL DOWNLOADS STATS
             ═══════════════════════════════════════ -->
        <section class="stats-section">
            <div class="container">
                <div class="stats-grid">
                    <!-- 1. OS Distribution (Left) -->
                    <div class="stats-card card animate-on-scroll">
                         <div class="spotlight"></div>
                         <div class="chart-container" style="position: relative; height: 160px; width: 100%; display: flex; justify-content: center;">
                            <canvas id="downloadsChart"></canvas>
                        </div>
                    </div>

                    <!-- 2. Total Downloads (Center) -->
                    <div class="stats-card card animate-on-scroll">
                        <div class="spotlight"></div>
                        <div class="stats-content">
                            <div class="stats-icon">
                                <i class="fa-solid fa-download"></i>
                            </div>
                            <div class="stats-info">
                                <span class="stats-label">Total Downloads</span>
                                <span class="stats-value total-downloads-value">
                                    <i class="fa-solid fa-spinner fa-spin"></i>
                                </span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 3. Architecture Distribution (Right) -->
                    <div class="stats-card card animate-on-scroll">
                         <div class="spotlight"></div>
                         <div class="chart-container" style="position: relative; height: 160px; width: 100%; display: flex; justify-content: center;">
                            <canvas id="archChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- ═══════════════════════════════════════
             RELEASES TABLE
             ═══════════════════════════════════════ -->
        <section class="releases-section section-padding">
            <div class="container">
                <div class="releases-container">
                    <div class="releases-filter">
                        <label class="releases-filter-label" for="release-repo">Repository</label>
                        <div class="releases-filter-controls">
                            <select id="release-repo" class="releases-filter-select">
                                <option value="ShareX/XerahS">ShareX/XerahS</option>
                                <option value="KovaForge/XerahS">KovaForge/XerahS</option>
                                <option value="all">All repositories</option>
                                <option value="custom">Any repository…</option>
                            </select>
                            <form id="release-repo-custom" class="releases-filter-custom" hidden>
                                <input id="release-repo-input" type="text" inputmode="text"
                                    placeholder="owner/repo" autocomplete="off" spellcheck="false"
                                    aria-label="GitHub repository as owner/repo">
                                <button type="submit" class="btn btn-secondary">Show</button>
                            </form>
                        </div>
                        <p class="releases-filter-hint" id="release-repo-hint"></p>
                        <p class="releases-filter-error" id="release-repo-error" hidden></p>
                    </div>
                    <div class="releases-loading" id="releases-loading">
                        <i class="fa-solid fa-spinner fa-spin"></i>
                        <span>Loading releases...</span>
                    </div>
                    <div class="releases-list" id="releases-list"></div>
                </div>
            </div>
        </section>
    </main>

    {% include footer.html %}

    <!-- ═══════════════════════════════════════
         SCRIPTS
         ═══════════════════════════════════════ -->
    <script>
        function showDiagnosticError(message, details = '') {
            const bannerEl = document.getElementById('diagnostic-banner');
            if (!bannerEl) return;

            bannerEl.hidden = false;
            bannerEl.innerHTML = '';

            const titleEl = document.createElement('strong');
            titleEl.textContent = 'Page error: ';
            bannerEl.appendChild(titleEl);
            bannerEl.appendChild(document.createTextNode(message));

            if (details) {
                const detailsEl = document.createElement('div');
                detailsEl.className = 'error-banner-details';
                detailsEl.textContent = details;
                bannerEl.appendChild(detailsEl);
            }
        }

        window.addEventListener('error', (event) => {
            const detail = event?.error?.message || event?.message || 'Unknown JavaScript error';
            showDiagnosticError('Script execution failed before content finished loading.', detail);
        });

        window.addEventListener('unhandledrejection', (event) => {
            const reason = event?.reason;
            const detail = reason instanceof Error ? reason.message : String(reason || 'Unknown promise rejection');
            showDiagnosticError('An async operation failed while loading downloads.', detail);
        });
        // ─────────────────────────────────────────
        // Scroll-triggered animations
        // ─────────────────────────────────────────
        const observerOptions = {
            threshold: 0.15,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, observerOptions);

        document.querySelectorAll('.animate-on-scroll').forEach(el => {
            observer.observe(el);
        });

        // ─────────────────────────────────────────
        // Mobile menu toggle
        // ─────────────────────────────────────────
        const navToggle = document.querySelector('.nav-toggle');
        const navMobile = document.querySelector('.nav-mobile');

        if (navToggle && navMobile) {
            navToggle.addEventListener('click', () => {
                const isActive = navToggle.classList.toggle('active');
                navMobile.classList.toggle('active');
                navToggle.setAttribute('aria-expanded', isActive);
            });
        } else {
            const navMissingMessage = window.location.protocol === 'file:'
                ? 'Navigation include is missing because this page is opened from disk; run it through Jekyll/local server.'
                : 'Navigation controls are missing in the rendered page.';
            showDiagnosticError(navMissingMessage);
        }

        // ─────────────────────────────────────────
        // Theme toggle functionality
        // ─────────────────────────────────────────
        const themeToggles = document.querySelectorAll('.theme-toggle');
        const html = document.documentElement;
        // Keep chart refs initialized before theme setup to avoid TDZ ReferenceError.
        let downloadsChart = null;
        let archChart = null;

        function getPreferredTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) return savedTheme;
            return 'dark'; // Default to dark mode
        }

        function setTheme(theme) {
            if (theme === 'light') {
                html.setAttribute('data-theme', 'light');
            } else {
                html.removeAttribute('data-theme');
            }
            localStorage.setItem('theme', theme);
            updateChartTheme();
        }

        setTheme(getPreferredTheme());

        themeToggles.forEach(toggle => {
            toggle.addEventListener('click', () => {
                const currentTheme = html.getAttribute('data-theme');
                const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                setTheme(newTheme);
            });
        });

        // ─────────────────────────────────────────
        // Chart Configuration
        // ─────────────────────────────────────────
        function updateChartTheme() {
            const isLight = html.getAttribute('data-theme') === 'light';
            const textColor = isLight ? '#1D1D1F' : '#EDEDEF';
            
            if (downloadsChart) {
                downloadsChart.options.plugins.legend.labels.color = textColor;
                downloadsChart.update();
            }
            
            if (archChart) {
                archChart.options.plugins.legend.labels.color = textColor;
                archChart.update();
            }
        }

        const percentageLabelsPlugin = {
            id: 'percentageLabels',
            afterDatasetsDraw(chart, args, pluginOptions) {
                const dataset = chart.data.datasets?.[0];
                const meta = chart.getDatasetMeta(0);
                if (!dataset || !meta || meta.hidden) return;

                const values = dataset.data.map(value => Number(value) || 0);
                const total = values.reduce((sum, value) => sum + value, 0);
                if (total <= 0) return;

                const minPercent = typeof pluginOptions?.minPercent === 'number'
                    ? pluginOptions.minPercent
                    : 3;

                const { ctx } = chart;
                ctx.save();
                ctx.font = "600 10px Inter, sans-serif";
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';
                ctx.fillStyle = '#FFFFFF';

                meta.data.forEach((arc, index) => {
                    const value = values[index];
                    if (value <= 0) return;

                    const percent = (value / total) * 100;
                    if (percent < minPercent) return;

                    const angle = (arc.startAngle + arc.endAngle) / 2;
                    const radius = (arc.innerRadius + arc.outerRadius) / 2;
                    const x = arc.x + Math.cos(angle) * radius;
                    const y = arc.y + Math.sin(angle) * radius;
                    const label = `${percent.toFixed(1)}%`;

                    ctx.strokeText(label, x, y);
                    ctx.fillText(label, x, y);
                });

                ctx.restore();
            }
        };

        function createChartConfig(data, colors) {
            return {
                type: 'doughnut',
                plugins: [percentageLabelsPlugin],
                data: {
                    labels: Object.keys(data),
                    datasets: [{
                        data: Object.values(data),
                        backgroundColor: colors,
                        borderColor: 'transparent',
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: {
                                color: html.getAttribute('data-theme') === 'light' ? '#1D1D1F' : '#EDEDEF',
                                font: {
                                    family: "'Inter', sans-serif",
                                    size: 11
                                },
                                usePointStyle: true,
                                padding: 15,
                                boxWidth: 8
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(5, 5, 6, 0.9)',
                            titleColor: '#EDEDEF',
                            bodyColor: '#A1A1AA',
                            borderColor: 'rgba(255, 255, 255, 0.1)',
                            borderWidth: 1,
                            padding: 10,
                            cornerRadius: 6,
                            displayColors: true,
                            callbacks: {
                                label: function(context) {
                                    const value = context.raw;
                                    const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                    const percentage = ((value / total) * 100).toFixed(1) + '%';
                                    return ` ${context.label}: ${value.toLocaleString()} (${percentage})`;
                                }
                            }
                        },
                        percentageLabels: {
                            minPercent: 3
                        }
                    },
                    cutout: '70%',
                    layout: {
                        padding: 0
                    },
                    animation: {
                        animateScale: true,
                        animateRotate: true
                    }
                }
            };
        }

        function initCharts(osStats, archStats) {
            if (downloadsChart) {
                downloadsChart.destroy();
                downloadsChart = null;
            }
            if (archChart) {
                archChart.destroy();
                archChart = null;
            }

            if (typeof Chart === 'undefined') {
                console.error('Chart.js library not loaded');
                return;
            }

            // OS Chart
            const osCanvas = document.getElementById('downloadsChart');
            if (osCanvas) {
                const osCtx = osCanvas.getContext('2d');
                const osColors = ['#5E6AD2', '#F59E0B', '#10B981']; // Indigo, Amber, Emerald
                
                const osData = {
                    'Windows': osStats.windows,
                    'Linux': osStats.linux,
                    'macOS': osStats.mac
                };
                
                downloadsChart = new Chart(osCtx, createChartConfig(osData, osColors));
            } else {
                console.warn('Downloads chart canvas not found');
            }
            
            // Architecture Chart
            const archCanvas = document.getElementById('archChart');
            if (archCanvas) {
                const archCtx = archCanvas.getContext('2d');
                const archColors = ['#8B5CF6', '#EC4899', '#64748B']; // Violet, Pink, Slate
                
                // Filter out unknown if zero or negligible
                const archData = {
                    'x64': archStats.x64,
                    'ARM64': archStats.arm64
                };
                
                archChart = new Chart(archCtx, createChartConfig(archData, archColors));
            } else {
                console.warn('Architecture chart canvas not found');
            }
        }

        // ─────────────────────────────────────────
        // Fetch releases from GitHub
        // ─────────────────────────────────────────
        const knownRepos = ['ShareX/XerahS', 'KovaForge/XerahS'];
        const defaultRepo = 'ShareX/XerahS';
        const repoSlugPattern = /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/;
        const releaseCache = new Map();
        let loadToken = 0;

        function isPublicReleaseAsset(name) {
            if (!name) return false;

            const lower = name.toLowerCase();

            // Exclude build/debug artifacts that should not be surfaced as end-user downloads.
            if (lower.endsWith('.wixpdb') || lower.endsWith('.pdb') || lower.endsWith('.symbols.nupkg')) {
                return false;
            }

            return lower.endsWith('.exe') ||
                lower.endsWith('.msi') ||
                lower.endsWith('.tar.gz') ||
                lower.endsWith('.deb') ||
                lower.endsWith('.rpm') ||
                lower.endsWith('.nupkg');
        }

        function isRepoSlug(value) {
            return repoSlugPattern.test(value);
        }

        function canonicalRepo(value) {
            const match = knownRepos.find(repo => repo.toLowerCase() === value.toLowerCase());
            return match || value;
        }

        function readSelectionFromUrl() {
            const raw = new URLSearchParams(window.location.search).get('repo');
            const value = (raw || '').trim();
            if (!value) return { mode: 'repo', repo: defaultRepo };
            if (value.toLowerCase() === 'all') return { mode: 'all' };
            if (isRepoSlug(value)) return { mode: 'repo', repo: canonicalRepo(value) };
            return { mode: 'repo', repo: defaultRepo };
        }

        function writeSelectionToUrl(selection) {
            const url = new URL(window.location.href);
            if (selection.mode === 'all') {
                url.searchParams.set('repo', 'all');
            } else if (selection.repo === defaultRepo) {
                url.searchParams.delete('repo');
            } else {
                url.searchParams.set('repo', selection.repo);
            }
            history.replaceState(null, '', url);
        }

        function selectionLabel(selection) {
            return selection.mode === 'all' ? 'all repositories' : selection.repo;
        }

        function setFilterHint(selection) {
            const hintEl = document.getElementById('release-repo-hint');
            if (!hintEl) return;

            hintEl.replaceChildren();
            hintEl.append('Showing releases from ');

            const repos = selection.mode === 'all' ? knownRepos : [selection.repo];
            repos.forEach((repo, index) => {
                if (index > 0) hintEl.append(' and ');
                const link = document.createElement('a');
                link.href = `https://github.com/${repo}/releases`;
                link.target = '_blank';
                link.rel = 'noopener';
                link.textContent = repo;
                hintEl.append(link);
            });
            hintEl.append('.');
        }

        function setFilterError(message) {
            const errorEl = document.getElementById('release-repo-error');
            if (!errorEl) return;
            errorEl.hidden = !message;
            errorEl.textContent = message || '';
        }

        function syncFilterControls(selection) {
            const selectEl = document.getElementById('release-repo');
            const customForm = document.getElementById('release-repo-custom');
            const inputEl = document.getElementById('release-repo-input');
            if (!selectEl || !customForm || !inputEl) return;

            const known = selection.mode === 'repo'
                ? knownRepos.find(repo => repo.toLowerCase() === selection.repo.toLowerCase())
                : null;

            if (selection.mode === 'all') {
                selectEl.value = 'all';
                customForm.hidden = true;
            } else if (known) {
                selectEl.value = known;
                customForm.hidden = true;
            } else {
                selectEl.value = 'custom';
                customForm.hidden = false;
                inputEl.value = selection.repo;
            }

            setFilterHint(selection);
            setFilterError('');
        }

        async function fetchRepoReleases(repo) {
            if (releaseCache.has(repo)) return releaseCache.get(repo);

            let releases = [];
            let page = 1;
            const perPage = 100;

            while (true) {
                const response = await fetch(
                    `https://api.github.com/repos/${repo}/releases?per_page=${perPage}&page=${page}`
                );
                if (!response.ok) throw new Error(`Failed to fetch ${repo} (${response.status})`);

                const pageReleases = await response.json();
                if (!Array.isArray(pageReleases) || pageReleases.length === 0) break;

                releases = releases.concat(pageReleases.map(release => ({ ...release, sourceRepo: repo })));
                if (pageReleases.length < perPage) break;
                page++;
            }

            releaseCache.set(repo, releases);
            return releases;
        }

        function resetReleaseLoading() {
            const loadingEl = document.getElementById('releases-loading');
            const listEl = document.getElementById('releases-list');
            const totalEl = document.querySelector('.total-downloads-value');

            if (listEl) listEl.innerHTML = '';
            if (totalEl) {
                totalEl.innerHTML = '';
                const spinner = document.createElement('i');
                spinner.className = 'fa-solid fa-spinner fa-spin';
                totalEl.append(spinner);
            }
            if (loadingEl) {
                loadingEl.style.display = '';
                loadingEl.innerHTML = '';
                const spinner = document.createElement('i');
                spinner.className = 'fa-solid fa-spinner fa-spin';
                const label = document.createElement('span');
                label.textContent = 'Loading releases...';
                loadingEl.append(spinner, label);
            }
        }

        function renderReleases(allReleases) {
            const loadingEl = document.getElementById('releases-loading');
            const listEl = document.getElementById('releases-list');
            const totalEl = document.querySelector('.total-downloads-value');

            allReleases.sort((a, b) => new Date(b.published_at) - new Date(a.published_at));

            let totalDownloads = 0;
            let osStats = { windows: 0, mac: 0, linux: 0 };
            let archStats = { x64: 0, arm64: 0 };
            let previousDate = new Date();
            let html = '';
            let renderedCount = 0;

            allReleases.forEach((release) => {
                if (!release.assets || !Array.isArray(release.assets) || release.assets.length === 0) return;

                let releaseDownloads = 0;

                release.assets.forEach(asset => {
                    const count = asset.download_count || 0;
                    releaseDownloads += count;

                    if (!asset.name) return;
                    const name = asset.name.toLowerCase();

                    // OS Categorization
                    if (name.includes('mac') || name.includes('darwin') || name.includes('.dmg') || name.includes('.pkg')) {
                        osStats.mac += count;
                    } else if (name.includes('linux') || name.includes('.deb') || name.includes('.rpm') || name.includes('.appimage')) {
                        osStats.linux += count;
                    } else if (name.includes('windows') || name.includes('win') || name.includes('.exe') || name.includes('.msi') || name.includes('portable')) {
                        osStats.windows += count;
                    }

                    // Architecture Categorization
                    if (name.includes('arm64') || name.includes('aarch64')) {
                        archStats.arm64 += count;
                    } else if (name.includes('x64') || name.includes('x86_64') || name.includes('amd64') || name.includes('win64')) {
                        archStats.x64 += count;
                    } else if (!name.includes('arm')) {
                        archStats.x64 += count;
                    }
                });

                totalDownloads += releaseDownloads;

                const publishedDate = new Date(release.published_at);
                const activeDays = ((previousDate - publishedDate) / (1000 * 60 * 60 * 24)).toFixed(1);
                previousDate = publishedDate;

                const isLatest = renderedCount === 0;
                renderedCount++;
                const isPrerelease = release.prerelease;
                const sourceRepo = release.sourceRepo || '';
                const displayAssets = release.assets
                    .filter(asset => isPublicReleaseAsset(asset.name))
                    .sort((a, b) => b.download_count - a.download_count);

                html += `
                    <div class="release-card card">
                        <div class="spotlight"></div>
                        <div class="release-header" onclick="this.parentElement.classList.toggle('expanded')">
                            <div class="release-info">
                                <div class="release-title-row">
                                    <h3 class="release-name">${escapeHtml(release.name || release.tag_name || 'Release')}</h3>
                                    <div class="release-badges">
                                        ${isLatest ? '<span class="release-badge release-badge-latest">Latest</span>' : ''}
                                        ${isPrerelease ? '<span class="release-badge release-badge-prerelease">Pre-release</span>' : ''}
                                    </div>
                                </div>
                                <div class="release-meta">
                                    <span class="release-repo"><i class="fa-brands fa-github"></i> ${escapeHtml(sourceRepo)}</span>
                                    <span class="release-tag"><i class="fa-solid fa-tag"></i> ${escapeHtml(release.tag_name)}</span>
                                    <span class="release-date"><i class="fa-solid fa-calendar"></i> ${publishedDate.toLocaleDateString('en-CA')}</span>
                                    <span class="release-days"><i class="fa-solid fa-clock"></i> ${activeDays} days</span>
                                    <span class="release-downloads"><i class="fa-solid fa-download"></i> ${releaseDownloads.toLocaleString()}</span>
                                </div>
                            </div>
                            <i class="fa-solid fa-chevron-down release-expand-icon"></i>
                        </div>
                        <div class="release-assets">
                            ${displayAssets.map(asset => `
                                <a href="${asset.browser_download_url}" class="asset-item">
                                    <span class="asset-name"><i class="fa-solid fa-file"></i> ${escapeHtml(asset.name)}</span>
                                    <div class="asset-meta">
                                        <span class="asset-size">${formatBytes(asset.size)}</span>
                                        <span class="asset-downloads"><i class="fa-solid fa-download"></i> ${asset.download_count.toLocaleString()}</span>
                                    </div>
                                </a>
                            `).join('')}
                        </div>
                    </div>
                `;
            });

            if (totalEl) totalEl.textContent = totalDownloads.toLocaleString();
            if (!html) {
                listEl.innerHTML = `<div class="releases-empty">No releases found for ${escapeHtml(selectionLabel(currentSelection))}.</div>`;
            } else {
                listEl.innerHTML = html;
            }
            if (loadingEl) loadingEl.style.display = 'none';
            initCharts(osStats, archStats);
        }

        let currentSelection = { mode: 'repo', repo: defaultRepo };

        async function showSelection(selection) {
            const token = ++loadToken;
            currentSelection = selection;
            syncFilterControls(selection);
            resetReleaseLoading();

            const loadingEl = document.getElementById('releases-loading');
            const totalEl = document.querySelector('.total-downloads-value');

            try {
                const repos = selection.mode === 'all' ? knownRepos : [selection.repo];
                const releasesByRepo = await Promise.all(repos.map(fetchRepoReleases));
                if (token !== loadToken) return;

                renderReleases(releasesByRepo.flat());
            } catch (error) {
                if (token !== loadToken) return;
                console.error(error);
                if (totalEl) totalEl.textContent = 'Error';
                showDiagnosticError('Failed to load release data from GitHub.', error.message || String(error));

                if (loadingEl) {
                    loadingEl.innerHTML = `
                        <div class="error-message">
                            <i class="fa-solid fa-exclamation-circle"></i>
                            <span>Failed to load releases. The API request may have been rate-limited or failed. <br><span style="font-size: 0.8em; opacity: 0.8;">${escapeHtml(error.message || String(error))}</span></span>
                        </div>
                    `;
                }
            }
        }

        function applySelection(selection) {
            writeSelectionToUrl(selection);
            showSelection(selection);
        }

        function bindReleaseFilter() {
            const selectEl = document.getElementById('release-repo');
            const customForm = document.getElementById('release-repo-custom');
            const inputEl = document.getElementById('release-repo-input');
            if (!selectEl || !customForm || !inputEl) return;

            selectEl.addEventListener('change', () => {
                const value = selectEl.value;
                if (value === 'custom') {
                    customForm.hidden = false;
                    setFilterError('');
                    if (!inputEl.value.trim()) {
                        const hintEl = document.getElementById('release-repo-hint');
                        if (hintEl) hintEl.textContent = 'Enter any GitHub repository as owner/repo.';
                    }
                    inputEl.focus();
                    return;
                }

                customForm.hidden = true;
                if (value === 'all') {
                    applySelection({ mode: 'all' });
                } else {
                    applySelection({ mode: 'repo', repo: value });
                }
            });

            customForm.addEventListener('submit', (event) => {
                event.preventDefault();
                const repo = inputEl.value.trim();
                if (!isRepoSlug(repo)) {
                    setFilterError('Enter a GitHub repository as owner/repo.');
                    inputEl.focus();
                    return;
                }

                setFilterError('');
                applySelection({ mode: 'repo', repo: canonicalRepo(repo) });
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KiB', 'MiB', 'GiB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        bindReleaseFilter();
        const initialSelection = readSelectionFromUrl();
        writeSelectionToUrl(initialSelection);
        showSelection(initialSelection);
    </script>
</body>

</html>
